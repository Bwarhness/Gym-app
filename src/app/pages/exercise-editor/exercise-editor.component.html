<form [formGroup]="exerciseForm" (ngSubmit)="onSubmit()">
  <aside>
    <input formcontrolName="name" placeholder="Name">
    <textarea formcontrolName="shortDescription" placeholder="Short Description"></textarea>
    <app-tags [tags]="exerciseForm.get('tags')?.value"></app-tags>

    <button (click)="isEditMode = !isEditMode">
      {{ isEditMode ? 'Cancel' : 'Edit' }}
    </button>
  </aside>
  <main>


  </main>

</form>
