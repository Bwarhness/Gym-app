<div class="exercise-form-container">
  <h2>{{ isEditMode ? 'Edit Exercise' : 'Create New Exercise' }}</h2>
  <form [formGroup]="exerciseForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" formControlName="name" required>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" required></textarea>
    </div>

    <div class="form-group">
      <label for="image">Image URL</label>
      <input type="text" id="image" formControlName="image">
    </div>

    <div class="form-group">
      <label for="video">Video URL</label>
      <input type="text" id="video" formControlName="video">
    </div>

    <div class="form-group">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty" formControlName="difficulty" required>
        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Advanced">Advanced</option>
      </select>
    </div>

    <!-- Tags management can be added here -->

    <button type="submit" [disabled]="!exerciseForm.valid">
      {{ isEditMode ? 'Update Exercise' : 'Create Exercise' }}
    </button>
  </form>
</div>
